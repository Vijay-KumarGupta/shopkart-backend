version: '3.8'

# ShopKart Local Development Stack
# Starts all infrastructure + microservices

services:

  # ===== INFRASTRUCTURE =====

  postgres:
    image: postgres:16-alpine
    container_name: shopkart-postgres
    environment:
      POSTGRES_USER: shopkart
      POSTGRES_PASSWORD: shopkart123
      POSTGRES_DB: shopkart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkart"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopkart-redis
    command: redis-server --requirepass redis123 --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: shopkart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: shopkart-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shopkart-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopkart
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: shopkart-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health || exit 1
      interval: 20s
      timeout: 10s
      retries: 5

  # ===== SERVICE DISCOVERY =====

  eureka-server:
    build: ./eureka-server
    container_name: shopkart-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: curl -s http://localhost:8761/actuator/health | grep UP
      interval: 15s
      timeout: 5s
      retries: 5

  # ===== MICROSERVICES =====

  api-gateway:
    build: ./api-gateway
    container_name: shopkart-api-gateway
    ports:
      - "8000:8000"
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-shopkart-jwt-secret-key-must-be-256-bits-long-at-minimum}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: redis123
      SERVER_PORT: 8000
    healthcheck:
      test: curl -s http://localhost:8000/actuator/health | grep UP

  user-service:
    build: ./user-service
    container_name: shopkart-user-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_users
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: shopkart123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: redis123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-shopkart-jwt-secret-key-must-be-256-bits-long-at-minimum}
      SERVER_PORT: 8081

  product-service:
    build: ./product-service
    container_name: shopkart-product-service
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_products
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: shopkart123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8082

  cart-service:
    build: ./cart-service
    container_name: shopkart-cart-service
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: redis123
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8083

  order-service:
    build: ./order-service
    container_name: shopkart-order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_orders
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: shopkart123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8084

  payment-service:
    build: ./payment-service
    container_name: shopkart-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart_payments
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: shopkart123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_GATEWAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_key}
      PAYMENT_GATEWAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-secret}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8085

  notification-service:
    build: ./notification-service
    container_name: shopkart-notification-service
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8086

  # ===== OBSERVABILITY =====

  prometheus:
    image: prom/prometheus:latest
    container_name: shopkart-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: shopkart-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  es_data:
  grafana_data:

networks:
  default:
    name: shopkart-network
